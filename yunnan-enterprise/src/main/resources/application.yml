spring:
  application:
    name: yunnan-enterprise
  profiles:
    active: db
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yunnan_system
    username: root
    password: MySQL@4869
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      jedis:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 0
      timeout: 2000

project:
  folder: ./yunnan

log:
  root:
    level: INFO

server:
  port: 8082