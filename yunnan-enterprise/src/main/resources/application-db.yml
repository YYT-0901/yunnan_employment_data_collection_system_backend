spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yunnan_database_2?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
    username: root
    password: 1234567890
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      jedis:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 0
      timeout: 2000
  sql:
    init:
      mode: never  # 改为 never，表已存在时不重新创建
      schema-locations: classpath:schema-db.sql

mybatis:
  mapper-locations: classpath*:com/yunnancommon/mapper/*.xml
  type-aliases-package: com.yunnancommon.entity.po
  configuration:
    map-underscore-to-camel-case: true

