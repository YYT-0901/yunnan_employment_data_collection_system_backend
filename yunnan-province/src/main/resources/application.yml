spring:
  application:
    name: yunnan-province
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yunnan_system?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      jedis:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 0
      timeout: 2000
  # Druid 数据源配置
  druid:
    url: jdbc:avatica:remote:url=http://localhost:8888/druid/v2/sql/avatica/
    driver-class-name: org.apache.calcite.avatica.remote.Driver

#mybatis自动转驼峰
mybatis:
  configuration:
    map-underscore-to-camel-case: true

project:
  folder: ./yunnan

log:
  root:
    level: debug

admin:
  username: admin
  password: 123456

server:
  port: 8080
  servlet:
    context-path: /api
