spring:
  application:
    name: yunnan-province-test
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: HikariCPTestDatasource
      minimum-idle: 1
      idle-timeout: 180000
      maximum-pool-size: 5
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # 禁用 Redis 用于测试
  autoconfigure:
    exclude: 
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

project:
  folder: ./test-yunnan

log:
  root:
    level: info

admin:
  username: admin
  password: 123456

server:
  port: 8081
  servlet:
    context-path: /api
